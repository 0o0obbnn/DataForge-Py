# 金融数据配置文件
# 包含股票代码、货币代码、期货代码、商品代码等金融相关数据

finance:
  # 股票代码（按市场分类）
  stock_symbols:
    US:
      - AAPL
      - TSLA
      - MSFT
      - GOOGL
      - AMZN
      - NVDA
      - META
    CHINA:
      - 000001
      - 000002
      - 600000
      - 600036
      - 600519
      - 000858
      - 002415

  # ETF期权标的（A股）
  etf_option_symbols:
    CHINA:
      - "510050"
      - "510300"
      - "159915"
      - "510500"

  # 货币代码
  currencies:
    - USD
    - EUR
    - CNY
    - JPY
    - GBP
    - AUD
    - CAD
    - HKD
    - SGD

  # 货币符号映射
  currency_symbols:
    CNY: "¥"
    USD: "$"
    EUR: "€"
    JPY: "¥"
    GBP: "£"
    AUD: "A$"
    CAD: "C$"
    HKD: "HK$"
    SGD: "S$"

  # 期限（Tenors）
  tenors:
    - "1M"
    - "3M"
    - "6M"
    - "1Y"
    - "2Y"
    - "5Y"

  # 中金所股指期货代码
  stock_futures:
    CHINA:
      - IF
      - IC
      - IH
      - TF
      - TS

  # 商品期货代码和名称映射
  commodity_futures:
    CU: "沪铜"
    AL: "沪铝"
    ZN: "沪锌"
    PB: "沪铅"
    AU: "沪金"
    AG: "沪银"
    RB: "螺纹钢"
    HC: "热卷"
    SC: "原油"
    FU: "燃料油"
    BU: "沥青"
    RU: "橡胶"
