[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge"
version = "1.0.0"
description = "High-efficiency, flexible, and highly configurable test data generation tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "DataForge Team", email = "team@dataforge.com"}
]
keywords = ["test", "data", "generation", "mock", "faker", "chinese", "localization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
    "pandas>=2.0.0",
    "python-dateutil>=2.8.0",
    # AI and LangChain dependencies
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.20",
    "openai>=1.0.0",
    "anthropic>=0.8.0",
    "httpx>=0.25.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.10.0",
    "pytest-freezegun>=0.4.2",
    "mypy>=1.3.0",
    "ruff>=0.0.265",
    "black>=23.3.0",
    "isort>=5.12.0",
    "pre-commit>=3.3.3",
    "tox>=4.6.4",
    "types-python-jose>=3.3.0.0",
    "types-passlib>=1.7.4.0",
]
ai = [
    # Local model support
    "ollama>=0.1.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    # Chinese model support
    "zhipuai>=2.0.0",
    "dashscope>=1.14.0",
    # Additional AI tools
    "langsmith>=0.0.80",
    "chromadb>=0.4.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]
performance = [
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
]

[project.urls]
Homepage = "https://github.com/dataforge/dataforge"
Documentation = "https://dataforge.readthedocs.io"
Repository = "https://github.com/dataforge/dataforge.git"
"Bug Tracker" = "https://github.com/dataforge/dataforge/issues"

[project.scripts]
dataforge = "dataforge.cli.main:cli"

[project.entry-points."dataforge.generators"]
# Built-in generators will be registered here
name = "dataforge.generators.basic.name:NameGenerator"
phone = "dataforge.generators.basic.phone:PhoneGenerator"
idcard = "dataforge.generators.basic.idcard:IDCardGenerator"
bankcard = "dataforge.generators.basic.bankcard:BankCardGenerator"
age = "dataforge.generators.basic.age:AgeGenerator"
address = "dataforge.generators.basic.address:AddressGenerator"
uscc = "dataforge.generators.basic.uscc:USCCGenerator"

[tool.setuptools]
packages = ["dataforge"]

[tool.setuptools.package-data]
dataforge = [
    "data/**/*.json",
    "data/**/*.csv",
    "data/**/*.yaml",
    "config/templates/**/*.yaml",
    "config/templates/**/*.json"
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["dataforge"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# examples目录：演示代码的宽松规则
"examples/**/*.py" = [
    "E402",  # 演示代码需要在导入前设置sys.path
    "E722",  # 演示代码可能有裸except
    "B007",  # 演示代码可能有未使用的循环变量
    "F841",  # 演示代码可能有未使用的变量
]
# tests目录：测试代码的宽松规则
"tests/**/*.py" = [
    "E402",  # 测试代码可能需要在导入前设置sys.path
    "B017",  # pytest.raises(Exception)在测试中是合理的
    "C401",  # 测试代码中的生成器表达式
    "F841",  # 测试代码中可能有未使用的变量
    "B007",  # 测试代码中可能有未使用的循环变量
    "B024",  # 抽象基类没有抽象方法
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false  # 暂时关闭，减少71个no-any-return错误
warn_unused_configs = true
# 放宽全局严格模式，逐步改进
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
# disallow_untyped_decorators = true  # 暂时注释
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # 暂时关闭，避免type: ignore警告
warn_no_return = true
warn_unreachable = false  # 暂时关闭，减少99个unreachable错误
strict_equality = true

# 核心模块启用严格模式
[[tool.mypy.overrides]]
module = [
    "dataforge.core.generator",
    "dataforge.core.factory",
    "dataforge.core.exceptions",
    "dataforge.core.types",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# 忽略第三方库
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "yaml.*",
    "redis.*",
    "pytz.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "e2e: End-to-end tests",
    "stress: Stress tests",
    "security: Security tests",
    "slow: Slow-running tests",
]

[tool.coverage.run]
source = ["dataforge"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
